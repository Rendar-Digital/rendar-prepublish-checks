name: Check
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Cache pinned WordPress core download
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rendar-wp-core-cache
          key: wp-core-${{ hashFiles('bin/provision-wp-core') }}
      - name: Provision pinned WordPress core
        run: |
          core_dir=$(bash bin/provision-wp-core)
          echo "WP_CORE_DIR=$core_dir" >> "$GITHUB_ENV"
      - name: PHP lint
        run: bash bin/php-lint
      - name: Updater stub contract
        run: php tests/test-updater.php unconfigured && php tests/test-updater.php
      - name: Unit and contract tests
        run: bash tests/run.sh
      - name: build-zip
        run: bash bin/build-zip
      - name: build-zip excludes scaffolding
        run: bash tests/build-zip.sh
